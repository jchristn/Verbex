# Grafana dashboard provisioning for the Verbex observability stack.
# Loads all dashboard JSON files into a single top-level folder named "Verbex".
# Dashboards are organized by domain (Verbex - HTTP, Verbex - Application, etc.) within
# this one folder; there are no subfolders.

apiVersion: 1

providers:
  - name: Verbex
    orgId: 1
    folder: Verbex
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
