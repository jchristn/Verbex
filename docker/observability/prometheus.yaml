# Prometheus configuration for the Verbex observability stack.
# Scrapes metrics from the OpenTelemetry Collector's Prometheus exposition endpoint.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Metrics pushed by verbex-server / verbex-mcp over OTLP and re-exposed by the collector.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  # Optional: scrape the Verbex server's in-process Prometheus endpoint directly.
  # Enable Telemetry.Prometheus in the server (bind hostname "*") and expose port 9464,
  # then uncomment this job.
  # - job_name: verbex-server-direct
  #   static_configs:
  #     - targets: ['verbex-server:9464']

  # Prometheus self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
