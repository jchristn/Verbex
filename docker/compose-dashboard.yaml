services:
  verbex-dashboard:
    image: jchristn77/verbex-dashboard:v0.2.1
    container_name: verbex-dashboard
    ports:
      - "8200:8200"
    volumes:
      - ./dashboard/logs:/app/logs
    environment:
      - VERBEX_SERVER_URL=http://verbex-server:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8200/"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 15s
